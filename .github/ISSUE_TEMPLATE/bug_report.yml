name: Bug report
description: Report a reproducible TestWitness problem using sanitized information.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Never attach credentials, tokens, customer data,
        internal URLs, or an unreviewed evidence ZIP to a public issue.
  - type: input
    id: version
    attributes:
      label: TestWitness version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Microsoft Edge
        - Firefox
        - Safari or another browser
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser and operating-system version
      placeholder: Chrome 140 on Windows 11
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use a minimal, sanitized configuration and synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized warning codes or stack traces when useful.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, customer data, private URLs, and unreviewed evidence files.
          required: true
